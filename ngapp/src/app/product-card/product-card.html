<div class="card h-100 product-card border-0 shadow-sm">
  <div class="img-wrap">
    <img [src]="product().thumbnail" [alt]="product().title" />
    <span class="badge text-bg-light category">{{ product().category }}</span>
  </div>
  <div class="card-body d-flex flex-column">
    <h6 class="card-title fw-semibold">{{ product().title }}</h6>
    <p class="card-text text-muted small">{{ shortDescription() }}</p>
    <div class="d-flex justify-content-between align-items-center mt-auto">
      <span class="price">${{ product().price.toFixed(2) }}</span>
      <a [routerLink]="['/products', product().id]" class="btn btn-outline-primary btn-sm">
        Details
      </a>
    </div>
  </div>
</div>
